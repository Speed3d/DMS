<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="dms_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>dms_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    محرّك عرض الـPDF (pdf.js) **مستضاف محلياً** داخل التطبيق.

    ⚠️ لماذا: حزمة printing تجلبه افتراضياً من https://unpkg.com عند كل معاينة، فإن تعذّر
    الوصول للإنترنت (أو حجبه جدار ناري) فشل عرض أي PDF — المرفقات ومعاينة الصادر معاً —
    **لكل المستخدمين بلا استثناء**، بينما يبقى التنزيل يعمل لأنه طلبٌ لخادمنا لا للإنترنت.
    وهذا يتعارض مع قرار النشر (ADR-016): سيرفر داخلي قد يعمل بلا إنترنت، ولا يصحّ أن
    يعتمد نظام وثائق على طرف ثالث ليعرض وثائقه.

    المتغيّر أدناه يقرأه printing_web ويستبدل به عنوان الـCDN.
    عند ترقية حزمة printing: طابق الإصدار في app/web/pdfjs مع _pdfJsVersion فيها.

    🔴 **البادئة `./` إلزامية — لا تحذفها.** الحزمة تبني `${base}pdf.min.mjs` ثم تستدعي
    `import(...)`. وبلا `./` يصير النص **مُعرِّف وحدة مجرَّداً** (bare specifier) مثل اسم حزمة،
    فيرفضه المتصفّح بـ«Failed to resolve module specifier» ولا يُرسل طلباً أصلاً.
    والأسوأ: الاستثناء يقع داخل `_initPlugin` **بين acquire و release بلا try/finally**، فيبقى
    القفل محجوزاً ⇒ كل محاولة عرض تالية **تتعلّق إلى الأبد بلا رسالة خطأ** — وهذا ما ظهر
    كـ«توقّف البرنامج عن العمل» عند الضغط على زر العين.
    (`./` لا `/` لتبقى نسبيةً إلى `<base href>` إن استُضيف التطبيق تحت مسار فرعي.)
  -->
  <script>window.dartPdfJsBaseUrl = "./pdfjs/";</script>

  <!--
    نُحمّل pdf.js بأنفسنا هنا، ولا نترك الحزمة تُحمّله.

    🔴 لماذا: `Printing._initPlugin` في printing 5.15.0 يفعل التالي:
         await _loading.acquire();
         if (!_hasPdfJsLib) { ... _pdfJsUrlBase = window.getProperty('dartPdfJsBaseUrl'); ... }
         _loading.release();          // ← لا يوجد try/finally
       وقراءةُ الخاصية تُسنِد قيمة JS إلى `String`، فترمي في وضع التصحيح (DDC) —
       **والاستثناء يقع بعد acquire وقبل release**، فيبقى القفل محجوزاً إلى الأبد:
       كل استدعاء تالٍ لـ`Printing.info()` أو `Printing.raster()` **يتعلّق بلا رجعة**.
       والنتيجة كما رآها المالك: زر العين يفتح نافذة تدور **بلا نهاية وبلا رسالة خطأ**،
       ثم يبدو البرنامج «متوقّفاً عن العمل». ولا يظهر شيء في الكونسول لأن الخطأ يُبتلع.

    ✅ الحل: إن كان `window.pdfjsLib` مضبوطاً و`workerSrc` غير فارغ، فإن `_hasPdfJsLib`
       يعود true فتتخطّى الحزمة الكتلةَ المعطوبة بأكملها — فلا قراءة خاصية ولا قفل ولا تعليق.
       وهذا يعمل بلا إنترنت (ADR-016) لأن الملفات محلية.

    ⚠️ `./` إلزامية — بدونها يصير المسار «مُعرِّف وحدة مجرَّداً» يرفضه المتصفّح.
  -->
  <script type="module">
    try {
      const pdfjs = await import('./pdfjs/pdf.min.mjs');
      pdfjs.GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.min.mjs';
      window.pdfjsLib = pdfjs;
    } catch (e) {
      // لا نُسقط التطبيق: تبقى بقية الشاشات تعمل، وتفشل معاينة الـPDF وحدها بوضوح.
      console.error('تعذّر تحميل محرّك عرض الـPDF المحلي (app/web/pdfjs):', e);
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
