<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="dms_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>dms_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    محرّك عرض الـPDF (pdf.js) **مستضاف محلياً** داخل التطبيق.

    ⚠️ لماذا: حزمة printing تجلبه افتراضياً من https://unpkg.com عند كل معاينة، فإن تعذّر
    الوصول للإنترنت (أو حجبه جدار ناري) فشل عرض أي PDF — المرفقات ومعاينة الصادر معاً —
    **لكل المستخدمين بلا استثناء**، بينما يبقى التنزيل يعمل لأنه طلبٌ لخادمنا لا للإنترنت.
    وهذا يتعارض مع قرار النشر (ADR-016): سيرفر داخلي قد يعمل بلا إنترنت، ولا يصحّ أن
    يعتمد نظام وثائق على طرف ثالث ليعرض وثائقه.

    المتغيّر أدناه يقرأه printing_web ويستبدل به عنوان الـCDN.
    عند ترقية حزمة printing: طابق الإصدار في app/web/pdfjs مع _pdfJsVersion فيها.
  -->
  <script>window.dartPdfJsBaseUrl = "pdfjs/";</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
